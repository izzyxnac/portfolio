name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    environment: AI_ML_PORTFOLIO

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NODE_ENV: test
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run test:unit

      - name: Build application
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: AI_ML_PORTFOLIO
    needs: lint-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**
              
              📱 **Preview URL:** ${{ steps.deploy.outputs.preview-url }}
              
              This preview will be automatically updated when you push new commits to this PR.`
            })

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: AI_ML_PORTFOLIO
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.NEXT_PUBLIC_SITE_DESCRIPTION }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Vercel Project Configuration
        run: |
          echo "🔍 Vercel Configuration Check:"
          echo "VERCEL_ORG_ID: $VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"

          # Get project info
          vercel project ls --token=${{ secrets.VERCEL_TOKEN }} | grep -E "(ai-ml-portfolio|portfolio)" || echo "No matching projects found"

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          echo "🚀 Deploying to Vercel..."
          deployment_url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "📦 Deployment URL: $deployment_url"
          echo "production-url=$deployment_url" >> $GITHUB_OUTPUT

          # Get the actual production domain for this project
          echo "🌐 Getting production domain..."
          production_domain=$(vercel project domain ls --token=${{ secrets.VERCEL_TOKEN }} | grep -E "\.vercel\.app|\.com|\.net|\.org" | head -1 | awk '{print $1}')

          if [ -n "$production_domain" ]; then
            echo "✅ Production domain found: https://$production_domain"
            echo "production-domain=https://$production_domain" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No custom domain found, using deployment URL"
            echo "production-domain=$deployment_url" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies for E2E tests
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Wait for deployment to be available
        env:
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          echo "Waiting for deployment to be available..."
          target_url="${{ steps.deploy.outputs.production-domain }}"
          echo "Testing URL: $target_url"

          for i in {1..30}; do
            if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
              # Use bypass token if available
              if curl -s -f -o /dev/null -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$target_url"; then
                echo "✅ Site is available at $target_url (with bypass token)"
                break
              fi
            else
              # Fallback to regular request
              if curl -s -f -o /dev/null "$target_url"; then
                echo "✅ Site is available at $target_url"
                break
              fi
            fi
            echo "⏳ Waiting... (attempt $i/30)"
            sleep 10
          done

      - name: Debug E2E test environment
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.production-domain }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          echo "🔍 E2E Test Debug Info:"
          echo "PLAYWRIGHT_BASE_URL: $PLAYWRIGHT_BASE_URL"
          echo "VERCEL_PROTECTION_BYPASS set: $([ -n "$VERCEL_PROTECTION_BYPASS" ] && echo "YES" || echo "NO")"

          # Test the bypass token manually
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            echo "🧪 Testing bypass token with curl..."
            if curl -s -f -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" "$PLAYWRIGHT_BASE_URL" | head -20; then
              echo "✅ Bypass token works with curl"
            else
              echo "❌ Bypass token failed with curl"
              echo "Trying without bypass token..."
              curl -s "$PLAYWRIGHT_BASE_URL" | head -20
            fi
          else
            echo "❌ No bypass token available"
          fi

      - name: Test Playwright configuration
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.production-domain }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          echo "🧪 Testing Playwright configuration..."
          node -e "
            const config = require('./playwright.config.ts');
            console.log('Base URL:', process.env.PLAYWRIGHT_BASE_URL);
            console.log('Bypass token available:', !!process.env.VERCEL_PROTECTION_BYPASS);
            console.log('Extra headers:', JSON.stringify(config.default.use.extraHTTPHeaders, null, 2));
          "

      - name: Run E2E tests against production
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.production-domain }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: npm run test:e2e

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful: ${{ steps.deploy.outputs.production-url }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed"
          exit 1
