# Harden nginx for portfolio.naciri.me on 20.250.161.13 (Ubuntu nginx/1.24.0)
# Place: /etc/nginx/sites-available/portfolio.naciri.me  -> symlink to sites-enabled
# Global: ensure /etc/nginx/nginx.conf has `server_tokens off;` inside http { }

# 1) In /etc/nginx/nginx.conf, inside http { } add:
#    server_tokens off;
#    more_clear_headers Server; # if using headers-more module (optional)

server {
    listen 80;
    server_name portfolio.naciri.me 20.250.161.13;
    # ACME challenge for certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name portfolio.naciri.me;

    # --- TLS (managed by certbot) ---
    # ssl_certificate /etc/letsencrypt/live/portfolio.naciri.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portfolio.naciri.me/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Hide version globally (also set in nginx.conf) ---
    server_tokens off;

    # --- Security headers (defence in depth; Next.js also sends them via next.config.ts:42) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Hardened CSP: removed unsafe-eval, blob:; added object-src, base-uri, form-action, frame-ancestors
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Deprecated header removed intentionally: X-XSS-Protection

    # --- Compression (Next.js compress:false, let nginx handle) ---
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Proxy to Next.js (pm2 / systemd on 3000) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        # Do not override CSP etc from Next.js if already set; 'always' above ensures fallback
    }

    # --- Static assets caching ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- Block version disclosure on errors ---
    error_page 404 /404.html;
    error_page 50x /50x.html;
}

# --- Default server (catch-all for direct IP) must also hide version ---
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    return 444; # drop or 404 for direct IP access
}
